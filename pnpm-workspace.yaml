# Settings file for pnpm 11+. @esri/maplibre-arcgis@1.3.1 peers
# ~5.24.0 || ~6.3.0, which excludes the 6.4.1 XSS fix (CVE-2026-85061).
# 6.4+ is a security patch of the 6.3 line the plugin already targets.
packageExtensions:
  '@esri/maplibre-arcgis':
    peerDependencies:
      maplibre-gl: '~5.24.0 || >=6.3.0'
peerDependencyRules:
  allowedVersions:
    maplibre-gl: '>=6.4.1'
