# Frontend service (repo root). Railpack builds the Vite SPA and serves it
# with ./Caddyfile. /api is reverse-proxied to API_UPSTREAM so auth cookies
# stay SameSite=Lax on the public frontend host.
#
# Required on this service:
#   Railway service reference API_UPSTREAM to backend private domain and PORT.
# Do not set VITE_API_URL in production (browser must call relative /api).

[build]
builder = "RAILPACK"
